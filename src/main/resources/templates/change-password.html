<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
</head>
<body>
<h1>Change Password</h1>

<div th:if="${param.success}" style="color: green; margin-bottom: 10px;">
    Password changed successfully!
</div>

<form th:action="@{/change-password}" method="post">
    <div>
        <label>New Password:</label>
        <input type="password" name="newPassword" required minlength="4" />
    </div>
    <br/>
    <button type="submit">Update Password</button>
    <a th:href="@{/}"><button type="button">Back to Home</button></a>
</form>
</body>
</html>
