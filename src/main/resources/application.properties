server.port=8081
spring.application.name=inventory-management

spring.datasource.url=jdbc:sqlserver://dbrigitta-inventory-mgmt.database.windows.net:1433;databaseName=inventory-mgmt;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;authentication=ActiveDirectoryDefault

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

logging.level.org.springframework.security=DEBUG

spring.mvc.hiddenmethod.filter.enabled=true








